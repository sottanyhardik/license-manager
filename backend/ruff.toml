# Ruff lint ratchet (see docs/modernization/backend-audit/06_LINT_RATCHET.md).
# Only F401 (unused imports) is enforced for now. Other pyflakes/style debt is
# documented in the ratchet doc and is deliberately NOT enabled yet.
# Complements backend/.flake8 (undefined names F821/F822/F823).
target-version = "py314"
extend-exclude = ["migrations", ".venv", "venv", "htmlcov", "staticfiles", "media", "node_modules"]

[lint]
select = ["F401"]

# Documented baseline: per-file ignores go here, each with a reason.
[lint.per-file-ignores]
